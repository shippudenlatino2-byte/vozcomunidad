services:
  - type: web
    name: vozcomunidad-vecinal
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: vozcomunidad-db
          property: connectionString

databases:
  - name: vozcomunidad-db
    plan: free
    databaseName: vozcomunidad
    user: vozcomunidad
